name: static-analysis

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "0.13.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint
      run: uv run --no-sync ruff check .
    - name: Format check
      run: uv run --no-sync ruff format --check .
    - name: Type check
      run: uv run --no-sync mypy arxiv
