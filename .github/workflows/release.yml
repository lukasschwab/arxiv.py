name: Release to PyPI

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # hatch-vcs needs the release tag and history.
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Set up Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check release source
        run: make check
      - name: Build distributions using locked build dependencies
        # The backend is included in the dev dependency group and uv.lock.
        # Do not override the VCS-derived version: it must match this tag.
        run: uv build --no-build-isolation --python .venv/bin/python
      - name: Check distribution versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, "Expected one wheel and one sdist"
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata, = [n for n in wheel.namelist() if n.endswith(".dist-info/METADATA")]
              wheel_metadata = wheel.read(metadata)
          with tarfile.open(sdists[0]) as sdist:
              metadata, = [m for m in sdist.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
              with sdist.extractfile(metadata) as stream:
                  sdist_metadata = stream.read()
          for metadata in (wheel_metadata, sdist_metadata):
              parsed = BytesParser().parsebytes(metadata)
              assert parsed["Name"] == "arxiv", parsed["Name"]
              assert parsed["Version"] == os.environ["RELEASE_TAG"], parsed["Version"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  # The checkout, build, and tests never receive this job's OIDC permission.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arxiv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
